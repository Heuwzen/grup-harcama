<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1f1d1a;--mu:#7a746b;--ln:#e8e3db;--ac:#2f6f5e;--acx:#fff;--pos:#1f7a4d;--neg:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--tx:#f1eee9;--mu:#a09a90;--ln:#34322f;--ac:#5fb59e;--acx:#10231d;--pos:#6fd09b;--neg:#f08a76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);gap:8px}
.row:last-child{border-bottom:0}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{margin:0;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--ln);border-radius:999px;color:var(--tx);font-size:14px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:600}
.btn2{width:100%;margin-top:8px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:none;color:var(--tx);font-size:15px}
.sm{border:1px solid var(--neg);background:none;color:var(--neg);font-size:13px;padding:6px 12px;border-radius:8px;margin-top:4px}
.ok{border:1px solid var(--pos);background:none;color:var(--pos);font-size:13px;padding:6px 12px;border-radius:8px;margin-top:4px}
.big{font-size:26px;font-weight:700}
#msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#msg .ok{margin:0;font-size:15px;padding:8px 14px;flex-shrink:0}
.nb{border:1px solid var(--ln);background:none;color:var(--tx);font-size:13px;padding:6px 12px;border-radius:8px;margin-top:4px}
.undone{opacity:.55;text-decoration:line-through}
.hide,#msg.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Grup Harcama</h1>
<div id="net" class="card mu hide" style="padding:10px 12px"></div>
<section id="v-login" class="hide"><div class="card"><h2>Giriş</h2><div class="mu">Grubun şifresini gir. Bu telefon şifreyi hatırlar.</div><input type="password" id="pw" inputmode="numeric" autocomplete="off" style="margin-top:10px;width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px"><button class="btn" id="go">Giriş yap</button><div class="mu" id="pwerr" style="margin-top:8px"></div></div></section>
<div class="tabs hide" id="tabs"></div>
<div id="msg" class="card hide"></div>
<section id="v-ozet"></section>
<section id="v-ekle" class="hide"></section>
<section id="v-cikar" class="hide"></section>
<section id="v-gecmis" class="hide"></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,getDoc,onSnapshot,writeBatch,getDocs,query,orderBy,limit,deleteField} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

var fbApp=initializeApp({apiKey:"AIzaSyDGIinG_HM97ez-BJUTID7PFDpea_5aRMc",authDomain:"duygu-app-c9242.firebaseapp.com",projectId:"duygu-app-c9242",storageBucket:"duygu-app-c9242.firebasestorage.app",messagingSenderId:"734448635978",appId:"1:734448635978:web:e93f1fffe0ca7aee7596b3"});
var db;
try{db=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fbApp)}
var col=collection(db,"items"),bcol=collection(db,"backups"),unsub=null,timer=null,HASH="3e13609e0eb920e5179b592556f1e929bc6c1d6dbbfdc8bef0e8b36f8928f475",UK="gh.unlocked",LK="gh.lock";

// The shared people list is the doc items/_people. Removing someone only hides them from new entries.
var DEF=["Duygu","Işıl","Reyhan","Fatma","Aysun","Servet","Gülseven"],POOL="Havuz",P=DEF.slice(),ACT=DEF.slice(),PT={},PKEY="",pdExists=false,EXTRA=[];
var NAME_RE=/^[\p{L}\p{N} -]{1,20}$/u,ID_RE=/^[A-Za-z0-9-][A-Za-z0-9_-]{0,63}$/;
var items=[],trash=[],logs=[],raw={},P0=P.slice(),meta={fromCache:false,hasPendingWrites:false},busy={},bkList=null,logAll=false,msgT=null,mode="exp",tab="ozet",delId=null,payKey=null,rmName=null,loaded=false;
var MAXA=1000000000; // 10 milyon TL, in kuruş
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tl(c){var n=Math.abs(c)/100;return n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function nm(n){return n===POOL?"Havuz (kasa)":n}
function dt(ts){if(!ts)return "";var d=new Date(ts),o={day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";return d.toLocaleString("tr-TR",o)}
// Amounts typed the Turkish way: "400", "400,50", "1.000", "1.250,75". Returns kuruş, or NaN when unclear.
function parseTL(s){
  s=String(s||"").replace(/\s|TL|₺/gi,"");
  if(!/^\d[\d.,]*$/.test(s))return NaN;
  var c=s.lastIndexOf(","),d=s.lastIndexOf("."),ip=s,fr="";
  if(c>=0&&d>=0){
    if(c>d){ip=s.slice(0,c);fr=s.slice(c+1);if(!/^\d{1,3}(\.\d{3})*$/.test(ip))return NaN;ip=ip.replace(/\./g,"")}
    else{ip=s.slice(0,d);fr=s.slice(d+1);if(!/^\d{1,3}(,\d{3})*$/.test(ip))return NaN;ip=ip.replace(/,/g,"")}
  }else if(c>=0){if(s.indexOf(",")!==c)return NaN;ip=s.slice(0,c);fr=s.slice(c+1)}
  else if(d>=0){
    if(/^\d{1,3}(\.\d{3})+$/.test(s))ip=s.replace(/\./g,"");
    else if(s.indexOf(".")===d){ip=s.slice(0,d);fr=s.slice(d+1)}
    else return NaN;
  }
  if(!/^\d+$/.test(ip)||!/^\d{0,2}$/.test(fr))return NaN;
  var k=parseInt(ip,10)*100+(fr?parseInt((fr+"0").slice(0,2),10):0);
  return Number.isSafeInteger(k)&&k>0&&k<=MAXA?k:NaN;
}
function amtField(id){return '<input type="text" id="'+id+'" inputmode="decimal" autocomplete="off" placeholder="örn. 400 veya 1.250,50"><div class="mu" id="'+id+'-pv" style="margin-top:4px;min-height:18px"></div>'}
function bindAmt(id){var el=$(id),pv=$(id+"-pv");if(!el)return;var up=function(){var v=el.value.trim(),k=parseTL(v);pv.textContent=!v?"":k>0?"Kaydedilecek tutar: "+tl(k):"Tutar anlaşılmadı. Örnek: 400 veya 1.250,50";pv.style.color=v&&!(k>0)?"var(--neg)":""};el.oninput=up;up()}
function hash(s){var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lid(){return "_log_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function msg(t,btn,fn){
  var m=$("msg");clearTimeout(msgT);m.innerHTML="";
  var sp=document.createElement("span");sp.textContent=t;m.appendChild(sp);
  if(btn){var b=document.createElement("button");b.className="ok";b.textContent=btn;b.onclick=function(){if(fn()!==false)b.disabled=true};m.appendChild(b)}
  m.classList.remove("hide");
}
function hideMsgLater(ms){clearTimeout(msgT);msgT=setTimeout(function(){$("msg").classList.add("hide")},ms||4000)}
function fail(e){msg(e&&e.msg?e.msg:"Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene."+(e&&e.code?" ("+e.code+")":""))}

// Records come from a shared database: keep only well-formed ones.
// Any well-formed name counts as a person, even one missing from the people list (it then shows as out of the group), so no record is hidden.
function isP(n){return typeof n==="string"&&n!==POOL&&NAME_RE.test(n)}
function isPP(n){return n===POOL||isP(n)}
function clean(id,e){
  if(!e||typeof e!=="object")return null;
  var a=e.amount;if(!Number.isSafeInteger(a)||!(a>0))return null;
  var o={id:String(id),type:e.type,amount:a,ts:typeof e.ts==="number"?e.ts:0,desc:typeof e.desc==="string"?e.desc:""};
  if(e.type==="expense"){
    if(!isPP(e.payer)||!Array.isArray(e.shares))return null;
    o.payer=e.payer;o.shares=e.shares.filter(function(n,i,l){return isP(n)&&l.indexOf(n)===i});if(!o.shares.length)return null;
    if(e.v===2)o.v=2;
    // A custom split is used only when every part is a whole kuruş amount and the parts add up to the total; otherwise the split is equal.
    if(e.custom&&typeof e.custom==="object"){var c={},k,sum=0,ok=true,n=0;for(k in e.custom){var x=e.custom[k];if(!isP(k)||!Number.isSafeInteger(x)||x<0){ok=false;break}c[k]=x;sum+=x;n++}if(ok&&n&&sum===a)o.custom=c}
  }else if(e.type==="deposit"){if(!isP(e.payer))return null;o.payer=e.payer}
  else if(e.type==="payment"){if(!isPP(e.from)||!isPP(e.to)||e.from===e.to)return null;o.from=e.from;o.to=e.to}
  else return null;
  if(e.deleted===true){o.deleted=true;o.deletedAt=typeof e.deletedAt==="number"?e.deletedAt:0}
  return o;
}
// Action log entries (items/_log_*): what was done, and how to undo or redo it.
// rec: a record's state (none/on/del). person: a person's state (none/on/off). load: a backup load, prevId/nextId are backups docs.
var RS={none:1,on:1,del:1},PS={none:1,on:1,off:1};
function cleanLog(id,e){
  if(!e||e.type!=="log"||typeof e.label!=="string")return null;
  var o={id:id,kind:e.kind,label:e.label,at:typeof e.at==="number"?e.at:0,undone:e.undone===true};
  if(e.kind==="load"){if(typeof e.prevId!=="string"||typeof e.nextId!=="string")return null;o.prevId=e.prevId;o.nextId=e.nextId}
  else if(e.kind==="rec"||e.kind==="person"){
    var S=e.kind==="rec"?RS:PS;
    if(typeof e.target!=="string"||!S[e.from]||!S[e.to])return null;
    o.target=e.target;o.from=e.from;o.to=e.to;o.undoState=S[e.undoState]?e.undoState:null;
  }else return null;
  return o;
}
function data(e){var o={},k;for(k in e)if(k!=="id")o[k]=e[k];return o}
function title(e){return e.type==="expense"?e.desc+" ("+nm(e.payer)+" ödedi)":e.type==="deposit"?"Havuza para ("+e.payer+")":"Ödeme ("+nm(e.from)+" → "+nm(e.to)+")"}
function who(e){return e.type==="expense"?nm(e.payer)+" ödedi · "+(e.custom?"özel paylaşım: ":"paylaşan: ")+e.shares.join(", "):e.type==="deposit"?e.payer+" kasaya yatırdı":nm(e.from)+" → "+nm(e.to)}
function names(e){var l=[e.payer,e.from,e.to].concat(e.shares||[]).concat(e.custom?Object.keys(e.custom):[]);return l.filter(isP)}

function split(amt,list){var b=Math.floor(amt/list.length),r=amt-b*list.length,o={};list.forEach(function(p,i){o[p]=b+(i<r?1:0)});return o}
// New records (v:2): the payer takes the leftover kuruş, so nobody owes the payer an odd kuruş. Older records keep their old split.
function sharesOf(e){
  if(e.custom)return e.custom;
  if(e.v===2&&e.shares.indexOf(e.payer)>=0){var o=split(e.amount-e.amount%e.shares.length,e.shares);o[e.payer]+=e.amount%e.shares.length;return o}
  return split(e.amount,e.shares);
}
// Who owes whom: everyone owes the person who actually paid. Only debts between the same two people are netted.
function pairs(){
  var m={},k,out=[];
  function add(a,b,x){if(a===b||!x)return;if(a<b)m[a+"|"+b]=(m[a+"|"+b]||0)+x;else m[b+"|"+a]=(m[b+"|"+a]||0)-x}
  items.forEach(function(e){
    if(e.type==="expense"&&e.payer!==POOL){var s=sharesOf(e),n;for(n in s)add(n,e.payer,s[n])}
    else if(e.type==="payment"&&e.from!==POOL&&e.to!==POOL)add(e.to,e.from,e.amount);
  });
  for(k in m){var ab=k.split("|"),v=m[k];if(v>0)out.push([ab[0],ab[1],v]);else if(v<0)out.push([ab[1],ab[0],-v])}
  var ord=function(n){var i=P.indexOf(n);return i<0?999:i};
  out.sort(function(x,y){return ord(x[0])-ord(y[0])||y[2]-x[2]});
  return out;
}
function calc(){
  var bP={},pool=0;
  P.forEach(function(p){bP[p]=0});
  function add(p,x){bP[p]=(bP[p]||0)+x}
  items.forEach(function(e){
    var a=e.amount,k,s;
    if(e.type==="expense"&&e.payer===POOL){s=sharesOf(e);pool-=a;for(k in s)add(k,s[k])}
    else if(e.type==="deposit"){add(e.payer,-a);pool+=a}
    else if(e.type==="payment"){
      if(e.from===POOL){add(e.to,a);pool-=a}
      else if(e.to===POOL){add(e.from,-a);pool+=a}
    }
  });
  return {bP:bP,pool:pool};
}

// ---- Every change goes through logged(): the change and its log entry are written together.
function recState(id){var i;for(i=0;i<items.length;i++)if(items[i].id===id)return "on";for(i=0;i<trash.length;i++)if(trash[i].id===id)return "del";return "none"}
function personState(n){return P.indexOf(n)<0?"none":ACT.indexOf(n)>=0?"on":"off"}
function recWrite(b,id,st){b.set(doc(col,id),st==="del"?{deleted:true,deletedAt:Date.now()}:{deleted:false},{merge:true})}
function personWrite(b,n,st){
  var o={};
  if(!pdExists)P.forEach(function(x,i){o[x]={on:ACT.indexOf(x)>=0,t:PT[x]!=null?PT[x]:i}});
  o[n]=st==="none"?deleteField():{on:st==="on",t:PT[n]!=null?PT[n]:Date.now()};
  b.set(doc(col,"_people"),{type:"people",people:o},{merge:true});
}
// The page shows the result at once: the phone applies the change locally and sends it when it can (offline too).
function logged(label,entry,apply){
  var b=writeBatch(db),id=lid(),en=Object.assign({type:"log",at:Date.now(),label:label,undone:false},entry);
  apply(b);b.set(doc(col,id),en);
  b.commit().then(null,fail);
  var full=Object.assign({id:id},en);
  hold(id,1000);msg(label+" ✓","Geri al",function(){return undo(id,full)});hideMsgLater(10000);
}
// A line that was just used ignores taps for a moment, so a double tap cannot undo and then redo.
function hold(id,ms){busy[id]=1;setTimeout(function(){delete busy[id];if(loaded)renderGecmis()},ms)}
function findLog(id,fb){for(var i=0;i<logs.length;i++)if(logs[i].id===id)return logs[i];return fb||null}
function stateOf(en){return en.kind==="rec"?recState(en.target):personState(en.target)}
function canUndo(en){return !en.undone&&(en.kind==="load"||stateOf(en)===en.to)}
function canRedo(en){return en.undone&&(en.kind==="load"||stateOf(en)===en.undoState)}
function undo(id,fb){
  if(busy[id])return false;
  var en=findLog(id,fb);
  if(!en||!canUndo(en)){msg("Bu işlem sonradan değişti. Önce sonraki işlemi geri al.");hideMsgLater(6000);return}
  if(en.kind==="load")return switchLoad(en,true);
  var st=en.from;
  if(en.kind==="rec"&&st==="none")st="del";
  // Undoing "person added" only takes the person out of the group; the name stays, so records on other phones keep it.
  if(en.kind==="person"&&st==="none")st="off";
  if(en.kind==="person"&&st!=="on"&&ACT.length<2&&ACT[0]===en.target){msg("Grupta en az bir kişi kalmalı.");hideMsgLater(6000);return}
  var b=writeBatch(db);
  if(en.kind==="rec")recWrite(b,en.target,st);else personWrite(b,en.target,st);
  b.set(doc(col,en.id),{undone:true,undoState:st,undoneAt:Date.now()},{merge:true});
  b.commit().then(null,fail);
  var en2=Object.assign({},en,{undone:true,undoState:st});
  hold(en.id,1500);msg("Geri alındı: "+en.label,"Yeniden yap",function(){return redo(en.id,en2)});hideMsgLater(10000);
}
function redo(id,fb){
  if(busy[id])return false;
  var en=findLog(id,fb);
  if(!en||!canRedo(en)){msg("Bu işlem sonradan değişti. Önce sonraki işlemi geri al.");hideMsgLater(6000);return}
  if(en.kind==="load")return switchLoad(en,false);
  var b=writeBatch(db);
  if(en.kind==="rec")recWrite(b,en.target,en.to);else personWrite(b,en.target,en.to);
  b.set(doc(col,en.id),{undone:false},{merge:true});
  b.commit().then(null,fail);
  var en2=Object.assign({},en,{undone:false});
  hold(en.id,1500);msg("Yeniden yapıldı: "+en.label,"Geri al",function(){return undo(en.id,en2)});hideMsgLater(10000);
}

function renderTabs(){
  var t=[["ozet","Özet"],["ekle","Ekle"],["cikar","Çıkar"],["gecmis","Geçmiş"]];
  $("tabs").innerHTML=t.map(function(x){return '<button data-t="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("");
  $("tabs").querySelectorAll("button").forEach(function(bt){bt.onclick=function(){tab=bt.dataset.t;show()}});
}
function show(){
  var inn=unlocked();
  $("v-login").classList.toggle("hide",inn);$("tabs").classList.toggle("hide",!inn);
  renderTabs();
  ["ozet","ekle","cikar","gecmis"].forEach(function(v){$("v-"+v).classList.toggle("hide",!inn||v!==tab)});
}

function payRow(from,to,amt,label){
  var k=from+"|"+to+"|"+amt,a=esc(k);
  var btn=payKey===k?'<button class="ok" data-pdo="'+a+'">Evet, ödendi</button> <button class="sm" data-pno="1">Vazgeç</button>':'<button class="nb" data-pay="'+a+'">Borcu kapat</button>';
  return '<div class="row"><span>'+label+'</span><div style="text-align:right;flex-shrink:0"><div>'+tl(amt)+'</div>'+btn+'</div></div>';
}
// The records that decide one debt line: only these go into its "Borcu kapat" id, so phones that differ in unrelated records still agree.
function rel(e,a,b){
  var sh=function(x){return e.shares.indexOf(x)>=0||(e.custom&&e.custom[x]!=null)};
  if(a===POOL||b===POOL){var p=a===POOL?b:a;
    if(e.type==="expense")return e.payer===POOL&&sh(p);
    if(e.type==="deposit")return e.payer===p;
    return (e.from===POOL&&e.to===p)||(e.to===POOL&&e.from===p)}
  if(e.type==="expense")return (e.payer===a&&sh(b))||(e.payer===b&&sh(a));
  if(e.type==="payment")return (e.from===a&&e.to===b)||(e.from===b&&e.to===a);
  return false;
}
function sig(a,b){return hash(items.filter(function(e){return rel(e,a,b)}).map(function(e){return e.id}).sort().join(","))}
function renderOzet(){
  if(!loaded){$("v-ozet").innerHTML='<div class="card mu">Kayıtlar yükleniyor…</div>';return}
  var d=calc(),tr=pairs(),tot=0,ptot=0,pool=d.pool,cr=[];
  var h=pool>=0?'<div class="card"><h2>Kasada kalan</h2><div class="big">'+tl(pool)+'</div><div class="mu">Kasaya yatırılıp henüz harcanmayan para.</div></div>'
    :'<div class="card"><h2>Kasa açığı</h2><div class="big neg">−'+tl(pool)+'</div><div class="mu">Kasadan ödenen ama henüz kasaya yatırılmamış para. Aşağıdaki "Kasaya borç" ödenince kapanır. Para toplandıysa Ekle → Havuza para ile kaydet.</div></div>';
  h+='<div class="card"><h2>Kişilere borç (kim kime)</h2><div class="mu" style="margin-bottom:4px">Herkes payını, parayı kim ödediyse ona öder.</div>';
  if(!tr.length)h+='<div class="mu">Kişiler arasında borç yok.</div>';
  tr.forEach(function(t){tot+=t[2];h+=payRow(t[0],t[1],t[2],esc(t[0])+' → <b>'+esc(t[1])+'</b>')});
  h+='<div class="row"><b>Toplam</b><b>'+tl(tot)+'</b></div></div>';
  h+='<div class="card"><h2>Kasaya borç</h2>';
  P.forEach(function(p){var v=d.bP[p]||0;
    if(v>0){ptot+=v;h+=payRow(p,POOL,v,esc(p)+' → <b>Havuz (kasa)</b>')}
    else if(v<0)cr.push([p,-v])});
  if(!ptot)h+='<div class="mu">Kasaya borç yok.</div>';
  h+='<div class="row"><b>Kasaya toplam borç</b><b>'+tl(ptot)+'</b></div>';
  if(cr.length){
    h+='<h2 style="margin-top:14px">Kasada alacağı olan</h2>';
    cr.forEach(function(c){h+='<div class="row"><span>'+esc(c[0])+'</span><span class="pos">+'+tl(c[1])+'</span></div>'});
    h+='<div class="mu" style="margin-top:6px">Kasaya payından fazla yatırılan para. Sonraki kasa harcamalarında payından düşülür. Gerekirse Çıkar sekmesinden kasadan iade et.</div>';
  }
  h+='</div>';
  h+='<div class="card"><h2>Kişi başı toplam</h2>';
  P.forEach(function(p){
    var owe=0,get=0;
    tr.forEach(function(t){if(t[0]===p)owe+=t[2];if(t[1]===p)get+=t[2]});
    var bp=d.bP[p]||0,kp=Math.max(bp,0),ki=Math.max(-bp,0),net=get+ki-owe-kp;
    if(ACT.indexOf(p)<0&&!owe&&!get&&!kp&&!ki)return;
    h+='<div class="row"><div><div>'+esc(p)+'</div><div class="mu">kişilere '+tl(owe)+' · kasaya '+tl(kp)+(get+ki?' · alacak '+tl(get+ki):'')+'</div></div><span class="'+(net>0?"pos":net<0?"neg":"mu")+'">'+(net>0?"+":net<0?"−":"")+tl(net)+'</span></div>';
  });
  h+='<div class="mu" style="margin-top:6px">+ alacaklı, − toplam borçlu</div></div>';
  h+='<div class="mu" style="margin:-4px 2px 12px">Borç ödenince "Borcu kapat"a bas. Kısmi ödeme için Çıkar sekmesini kullan. Yapılan her işlem Geçmiş → İşlemler\'den geri alınabilir.</div>';
  var vo=$("v-ozet");vo.innerHTML=h;
  vo.querySelectorAll("[data-pay]").forEach(function(x){x.onclick=function(){payKey=x.dataset.pay;renderOzet()}});
  vo.querySelectorAll("[data-pno]").forEach(function(x){x.onclick=function(){payKey=null;renderOzet()}});
  vo.querySelectorAll("[data-pdo]").forEach(function(x){x.onclick=function(){
    x.disabled=true;
    var f=x.dataset.pdo.split("|"),a=parseInt(f[2],10);payKey=null;
    if(!isPP(f[0])||!isPP(f[1])||!(a>0)){renderOzet();return}
    // The same debt closed from two phones gets the same record id, so it is counted once.
    var nid="p"+hash(f[0]+"|"+f[1]+"|"+a+"|"+sig(f[0],f[1])),was=recState(nid);
    if(was==="on"){msg("Bu borç zaten kapatılmış.");hideMsgLater();renderOzet();return}
    logged("Borç kapatıldı: "+nm(f[0])+" → "+nm(f[1])+" · "+tl(a),{kind:"rec",target:nid,from:was,to:"on"},
      function(b){b.set(doc(col,nid),{type:"payment",from:f[0],to:f[1],amount:a,ts:Date.now(),desc:"Ödeme"})});
    renderOzet();
  }});
}

// Form fields keep what was typed when the page redraws (another phone changed something).
function grab(ids){var o={};ids.forEach(function(i){var el=$(i);if(el)o[i]=el.value});return o}
function put(o){for(var i in o){var el=$(i);if(!el)continue;if(el.tagName==="SELECT"){if([].some.call(el.options,function(x){return x.value===o[i]&&!x.disabled}))el.value=o[i]}else el.value=o[i]}}
function opts(withPool,all){
  return '<option value="" selected disabled>Seç</option>'+(withPool?[POOL]:[]).concat(all?P:ACT).map(function(p){
    return '<option value="'+esc(p)+'">'+esc(nm(p))+(p!==POOL&&ACT.indexOf(p)<0?' (gruptan çıktı)':'')+'</option>'}).join("");
}

  var tabsH='<div class="tabs"><button data-m="exp" class="'+(mode==="exp"?"on":"")+'">Harcama</button><button data-m="dep" class="'+(mode==="dep"?"on":"")+'">Havuza para</button></div>';

function save(){
  var err=$("err"),a=parseTL($("f-a").value),p=$("f-p").value;
  var d={amount:a,ts:Date.now()},label;
  if(mode==="exp"){
    var sh=[].slice.call(document.querySelectorAll(".f-s:checked")).map(function(x){return x.value});
    var ds=$("f-d").value.trim();
    if(!ds){err.textContent="Açıklama yaz.";return}
    if(!(a>0)){err.textContent="Tutarı anlaşılır yaz. Örnek: 400 veya 1.250,50";return}
    if(!p){err.textContent="Kimin ödediğini seç.";return}
    if(!sh.length){err.textContent="En az bir kişi seç.";return}
    d.type="expense";d.desc=ds;d.payer=p;d.shares=sh;d.v=2;label="Harcama eklendi: "+ds+" · "+tl(a)+" · "+nm(p)+" ödedi";
  }else{
    if(!p){err.textContent="Kimin yatırdığını seç.";return}
    if(!(a>0)){err.textContent="Tutarı anlaşılır yaz. Örnek: 400 veya 1.250,50";return}
    d.type="deposit";d.payer=p;d.desc="Havuza yatırdı";label="Havuza para eklendi: "+p+" · "+tl(a);
  }
  var nid=uid();
  logged(label,{kind:"rec",target:nid,from:"none",to:"on"},function(b){b.set(doc(col,nid),d)});
  tab="ozet";renderEkle(true);show();
}

// Returns true when the people list changed.
function setPeople(pd){
  var m=pd&&pd.people&&typeof pd.people==="object"?pd.people:null,list=[],k;
  if(m)for(k in m){var v=m[k];if(NAME_RE.test(k)&&k!==POOL&&v&&typeof v==="object")list.push([k,v.on!==false,typeof v.t==="number"?v.t:0])}
  pdExists=list.length>0;
  if(!list.length)list=DEF.map(function(n,i){return [n,true,i]});
  list.sort(function(a,b){return a[2]-b[2]});
  var key=JSON.stringify(list);if(key===PKEY)return false;PKEY=key;
  P0=list.map(function(x){return x[0]});ACT=list.filter(function(x){return x[1]}).map(function(x){return x[0]});
  PT={};list.forEach(function(x){PT[x[0]]=x[2]});
  return true;
}
function addPerson(){
  var n=$("np").value.trim().replace(/\s+/g," "),er=$("nperr");
  if(!NAME_RE.test(n)||n===POOL){er.textContent="Geçerli bir isim yaz (en fazla 20 harf).";return}
  var lo=n.toLocaleLowerCase("tr"),same=P.filter(function(x){return x.toLocaleLowerCase("tr")===lo})[0];
  if(same&&ACT.indexOf(same)>=0){er.textContent=same+" zaten grupta.";return}
  var nn=same||n;
  logged(same?"Gruba geri eklendi: "+nn:"Kişi eklendi: "+nn,{kind:"person",target:nn,from:same?"off":"none",to:"on"},function(b){personWrite(b,nn,"on")});
  $("np").value="";er.textContent="";
}

// ---- Backups. Every load first saves the current records as a "before" copy, so a load can be undone and redone.
function prepare(a){
  a=Array.isArray(a)?a:[];
  var extra=[];
  function add(n){if(isP(n)&&P0.indexOf(n)<0&&extra.indexOf(n)<0)extra.push(n)}
  a.forEach(function(e){if(!e||typeof e!=="object")return;add(e.payer);add(e.from);add(e.to);if(Array.isArray(e.shares))e.shares.forEach(add);if(e.custom&&typeof e.custom==="object")Object.keys(e.custom).forEach(add)});
  // Records are written back exactly as stored (raw), so fields and dates the page does not show are kept.
  var next=[],rw={};
  a.forEach(function(e){
    var id=e&&typeof e.id==="string"&&ID_RE.test(e.id)?e.id:uid(),c=clean(id,e),r={},k;
    if(!c)return;next.push(c);for(k in e)if(k!=="id")r[k]=e[k];rw[id]=r;
  });
  var usedNames=extra.filter(function(n){return next.some(function(e){return names(e).indexOf(n)>=0})});
  return {next:next,extra:usedNames,rw:rw};
}
function addPeopleOff(b,extra){
  // Names a backup uses that are no longer in the list come back as "out of the group", so no record is dropped.
  if(!extra.length)return;
  var o={},t=Date.now();
  if(!pdExists)P.forEach(function(x,i){o[x]={on:ACT.indexOf(x)>=0,t:PT[x]!=null?PT[x]:i}});
  extra.forEach(function(n,i){o[n]={on:false,t:t+i}});
  b.set(doc(col,"_people"),{type:"people",people:o},{merge:true});
}
// The records as they are now, taken once at the start of a load: both the "before" copy and the delete list use this same list.
function rawList(){return items.concat(trash).map(function(e){return Object.assign({},raw[e.id]||data(e),{id:e.id})})}
function snapDoc(cur){return {ts:Date.now(),kind:"before",count:cur.filter(function(e){return e.deleted!==true}).length,data:JSON.stringify(cur)}}
var loading=false;
function canLoad(){
  if(loading){msg("Bir yükleme sürüyor, bitmesini bekle.");hideMsgLater(6000);return false}
  if(!loaded||meta.fromCache||meta.hasPendingWrites||navigator.onLine===false){msg("Yedek yüklemek için internet bağlantısı gerekir. Bağlantı gelip bekleyen değişiklikler gönderilince tekrar dene.");hideMsgLater(8000);return false}
  return true;
}
// One load is one batch: the copies, the people list, the records and the log line land together or not at all,
// so no phone ever sees half a load, and a closed page cannot leave one half done.
function loadBatch(next,cur,rw,pre,post){
  var keep={};next.forEach(function(e){keep[e.id]=1});
  var ops=cur.filter(function(e){return !keep[e.id]}).map(function(e){return ["del",e.id]}).concat(next.map(function(e){return ["set",e.id,rw[e.id]||data(e)]}));
  function put(b,part){part.forEach(function(o){if(o[0]==="del")b["delete"](doc(col,o[1]));else b.set(doc(col,o[1]),o[2])})}
  if(ops.length<=450){var b=writeBatch(db);pre(b);put(b,ops);post(b);return b.commit()}
  // Very large record sets do not fit one batch: copies first, then records in parts, the log line last.
  var b0=writeBatch(db);pre(b0);var chain=b0.commit();
  for(var i=0;i<ops.length;i+=450)(function(part){chain=chain.then(function(){var b=writeBatch(db);put(b,part);return b.commit()})})(ops.slice(i,i+450));
  return chain.then(function(){var b=writeBatch(db);post(b);return b.commit()});
}
function restoreFrom(a,what,srcId){
  if(!canLoad())return false;
  var pr=prepare(a),next=pr.next;
  if(!next.length){msg("Yedekte geçerli kayıt yok.");return false}
  var nAct=next.filter(function(e){return !e.deleted}).length;
  if(!confirm(what+": "+nAct+" kayıt yüklenecek ve şu anki "+items.length+" kaydın yerine geçecek. Herkes için değişir. Şu anki hâl Yedekler'e kaydedilir, yükleme İşlemler'den geri alınabilir. Devam edilsin mi?"))return false;
  if(!canLoad())return false;
  msg("Yedek yükleniyor…");
  var t=Date.now(),prevId="before-"+t,nextId=srcId||("pasted-"+t),lg=lid(),cur=rawList();
  var en={type:"log",at:t,label:"Yedek yüklendi: "+what,undone:false,kind:"load",prevId:prevId,nextId:nextId};
  loading=true;
  loadBatch(next,cur,pr.rw,function(b){
    b.set(doc(bcol,prevId),snapDoc(cur));
    if(!srcId)b.set(doc(bcol,nextId),{ts:t,kind:"pasted",count:nAct,data:JSON.stringify(next.map(function(e){return Object.assign({},pr.rw[e.id],{id:e.id})}))});
    addPeopleOff(b,pr.extra);
  },function(b){b.set(doc(col,lg),en)}).then(function(){
    loading=false;
    var full=Object.assign({id:lg},en);bkList=null;renderGecmis();
    msg("Yedek yüklendi ✓","Geri al",function(){return undo(lg,full)});hideMsgLater(15000);
  },function(e){loading=false;fail(e)});
}
function switchLoad(en,isUndo){
  if(!canLoad())return false;
  if(!confirm((isUndo?"Yükleme geri alınacak":"Yükleme yeniden yapılacak")+": kayıtlar o hâline döner, sonradan yapılan değişiklikler de geri gider. Şu anki hâl Yedekler'e kaydedilir. Devam edilsin mi?"))return false;
  if(!canLoad())return false;
  if(isUndo?!canUndo(findLog(en.id,en)):!canRedo(findLog(en.id,en))){msg("Bu işlem sonradan değişti.");hideMsgLater(6000);return false}
  msg(isUndo?"Geri alınıyor…":"Yeniden yapılıyor…");
  var snapId="before-"+Date.now(),cur=rawList();loading=true;
  getDoc(doc(bcol,isUndo?en.prevId:en.nextId)).then(function(s){
    if(!s.exists())throw {msg:"Bu yedek artık yok (yedekler 30 gün saklanır)."};
    var a;try{a=JSON.parse(s.data().data)}catch(e){throw {msg:"Bu yedek okunamadı."}}
    var pr=prepare(a);
    if(!pr.next.length)throw {msg:"Bu yedekte kayıt yok, yüklenmedi. Kayıtlar olduğu gibi kaldı."};
    // Another phone may have undone or redone this line while the copy was being read.
    var l=findLog(en.id,en);
    if(isUndo?!canUndo(l):!canRedo(l))throw {msg:"Bu işlem bu arada başka bir telefonda değişti. Kayıtlar olduğu gibi kaldı."};
    if(meta.hasPendingWrites||meta.fromCache)throw {msg:"Bağlantı koptu, yüklenmedi. Kayıtlar olduğu gibi kaldı."};
    return loadBatch(pr.next,cur,pr.rw,function(b){b.set(doc(bcol,snapId),snapDoc(cur));addPeopleOff(b,pr.extra)},
      function(b){b.set(doc(col,en.id),isUndo?{undone:true,nextId:snapId,undoneAt:Date.now()}:{undone:false,prevId:snapId},{merge:true})});
  }).then(function(){
    loading=false;
    var en2=Object.assign({},en,isUndo?{undone:true,nextId:snapId}:{undone:false,prevId:snapId});bkList=null;
    msg((isUndo?"Geri alındı: ":"Yeniden yapıldı: ")+en.label,isUndo?"Yeniden yap":"Geri al",function(){return (isUndo?redo:undo)(en.id,en2)});hideMsgLater(15000);
  },function(e){loading=false;fail(e)});
}
function restore(){
  var a;
  try{a=JSON.parse($("bkt").value);if(!Array.isArray(a))throw 1}catch(e){msg("Yedek okunamadı. Metni eksiksiz yapıştır.");return}
  restoreFrom(a,"Yapıştırılan yedek",null);
}
function loadBackups(){
  getDocs(query(bcol,orderBy("ts","desc"),limit(40))).then(function(snap){
    bkList=snap.docs.map(function(d){var x=d.data();return {id:d.id,ts:typeof x.ts==="number"?x.ts:0,kind:x.kind,count:typeof x.count==="number"?x.count:0,data:typeof x.data==="string"?x.data:"[]"}});
    renderGecmis();
  },function(e){msg("Yedekler okunamadı."+(e&&e.code?" ("+e.code+")":""))});
}
function refresh(){renderOzet();renderGecmis()}

function listen(){
  timer=setTimeout(function(){if(!loaded)msg("Kayıtlara ulaşılamadı. İnternet bağlantını kontrol et.")},10000);
  unsub=onSnapshot(col,{includeMetadataChanges:true},function(snap){
    loaded=true;clearTimeout(timer);
    meta={fromCache:snap.metadata.fromCache,hasPendingWrites:snap.metadata.hasPendingWrites};
    var pd=null,recs=[],lg=[],rw={};
    snap.docs.forEach(function(d){
      var x=d.data();
      if(d.id==="_people"){pd=x;return}
      if(x&&x.type==="log"){var l=cleanLog(d.id,x);if(l)lg.push(l);return}
      recs.push([d.id,x]);rw[d.id]=x;
    });
    var ch=setPeople(pd);
    var all=recs.map(function(r){return clean(r[0],r[1])}).filter(Boolean);
    // Names used in records but missing from the people list show as out of the group.
    var np=P0.slice();all.forEach(function(e){names(e).forEach(function(n){if(np.indexOf(n)<0)np.push(n)})});
    if(np.join("|")!==P.join("|")){P=np;ch=true}
    raw=rw;items=all.filter(function(e){return !e.deleted});trash=all.filter(function(e){return e.deleted});
    logs=lg.sort(function(a,b){return b.at-a.at});
    if(ch){renderEkle();renderCikar()}
    refresh();netBar();
  },function(e){msg("Kayıtlar okunamadı."+(e&&e.code?" ("+e.code+")":""))});
}
// A line under the title says when the phone is offline or still sending.
function netBar(){
  var el=$("net"),t="";
  if(unlocked()&&loaded){
    if(navigator.onLine===false||meta.fromCache)t="İnternet yok. Gördüğün kayıtlar bu telefondaki son hâl. Yaptığın değişiklikler bağlantı gelince herkese gider.";
    else if(meta.hasPendingWrites)t="Değişiklikler gönderiliyor…";
  }
  el.textContent=t;el.classList.toggle("hide",!t);
}
window.addEventListener("online",netBar);window.addEventListener("offline",netBar);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function unlocked(){return ls(UK)===HASH}
function lockState(){try{return JSON.parse(ls(LK))||{n:0,until:0}}catch(e){return {n:0,until:0}}}
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function lockMsg(){var st=lockState(),m=Math.ceil((st.until-Date.now())/60000);if(m>0){$("pwerr").textContent="3 kez yanlış girildi. "+m+" dakika sonra tekrar dene.";$("go").disabled=true;setTimeout(lockMsg,15000);return true}$("go").disabled=false;return false}
function login(){
  var pw=$("pw").value.trim(),er=$("pwerr");
  if(lockMsg())return;
  if(!pw){er.textContent="Şifreyi yaz.";return}
  sha("grupharcama:"+pw).then(function(h){
    if(h===HASH){ls(LK,null);ls(UK,HASH);$("pw").value="";er.textContent="";listen();show();return}
    var st=lockState();st.n++;
    if(st.n>=3){st.n=0;st.until=Date.now()+15*60000}
    ls(LK,JSON.stringify(st));$("pw").value="";
    if(!lockMsg())er.textContent="Şifre yanlış. "+(3-st.n)+" hakkın kaldı.";
  });
}
$("go").onclick=login;
$("pw").onkeydown=function(e){if(e.key==="Enter")login()};
if(unlocked())listen();else lockMsg();
show();
renderEkle();renderCikar();refresh();
</script>
